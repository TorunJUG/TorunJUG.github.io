  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071b2d">
    <title>{{pageTitle}}</title>
    <meta name="description" content="{{description}}">
    <meta name="robots" content="index, follow, max-image-preview:large, max-video-preview:-1">
    <link rel="canonical" href="{{canonicalUrl}}">
    <meta property="og:type" content="article">
    <meta property="og:locale" content="pl_PL">
    <meta property="og:site_name" content="Toruń JUG">

    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="stylesheet" href="../styles.css">
    <script src="../script.js" defer></script>
    <script type="application/ld+json">

    </script>

    </header>
    <main id="main-content">
      <section class="meeting-hero">
        <div class="container">
          <p class="breadcrumb"><a href="../index.html">Strona główna</a> / <a href="../index.html#spotkania">Spotkania</a> / #{{number}}</p>
          <div class="meeting-hero-content">
            <p class="meeting-kicker">Toruń JUG #{{number}}</p>
            <h1>{{title}}</h1>
            <p class="meeting-hero-meta"><time datetime="{{startDate}}">{{dateAndTimeLabel}}</time><span>{{placeAndCity}}</span></p>
            <div class="meeting-hero-actions">
              <a class="button button-accent" href="{{meetupUrl}}" target="_blank" rel="noopener noreferrer">{{meetupLabel}} <span aria-hidden="true">↗</span></a>
            </div>
          </div>
        </div>
      </section>
      <section class="meeting-content">
        <div class="container meeting-layout meeting-layout-single">
          <div class="meeting-main">
            <h2>Prelekcje</h2>
            <div class="talk-list">
{{talks}}
            </div>
{{meetingNavigation}}
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-bottom">
        <p>© <span data-current-year>{{year}}</span> Toruń JUG</p>
        <p><a href="../index.html#spotkania">Wróć do listy spotkań</a></p>
      </div>
    </footer>
  </body>
</html>
